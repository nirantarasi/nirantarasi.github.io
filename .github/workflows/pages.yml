name: Deploy static site to GitHub Pages

# This repo only contains the VitePress build output, so publish it as-is.
# Do NOT use GitHub's branch/Jekyll builder: it renders every .md file and
# llms-full.txt through Liquid, which fails on the {{ ... }} Go templates in
# the docs and rewrites the VitePress HTML with a Jekyll theme.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Switches the repo from "Deploy from a branch" (Jekyll) to
          # "GitHub Actions" if it is still on the legacy source.
          enablement: true

      - name: Stage static files
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
